<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI_Hack — Panel de análisis</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" />
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #131722;
      --panel-2: #1a1f2e;
      --border: #232a3d;
      --text: #e7ecf3;
      --muted: #8b94a8;
      --accent: #7c5cff;
      --accent-2: #00d4ff;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 .material-symbols-outlined { color: var(--accent); }
    .pill {
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .pill.ok { color: var(--ok); border-color: rgba(34,197,94,.4); }
    .pill.err { color: var(--err); border-color: rgba(239,68,68,.4); }
    main {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      padding: 24px 32px;
    }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    textarea, input, select {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text);
      font-family: "JetBrains Mono", "Menlo", monospace;
      font-size: 13px;
      outline: none;
    }
    textarea { resize: vertical; min-height: 200px; }
    textarea:focus, input:focus { border-color: var(--accent); }
    .row { margin-bottom: 14px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button:hover { filter: brightness(1.15); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .results { display: flex; flex-direction: column; gap: 20px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; }
    .kpi {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .kpi .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .kpi .value { font-size: 22px; font-weight: 700; margin-top: 4px; color: var(--text); }
    .interpret {
      background: var(--panel-2);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 14px 16px;
      line-height: 1.55;
      font-size: 14px;
    }
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px,1fr)); gap: 16px; }
    .chart-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .chart-card h3 {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--text);
    }
    .chart-card canvas { width: 100% !important; height: 260px !important; }
    .empty {
      padding: 40px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
    .empty .material-symbols-outlined { font-size: 48px; opacity: 0.5; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
    }
    .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .preset {
      font-size: 11px;
      padding: 4px 10px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      color: var(--muted);
    }
    .preset:hover { color: var(--text); border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>
      <span class="material-symbols-outlined">auto_awesome</span>
      AI_Hack — Panel de análisis
    </h1>
    <span id="health" class="pill">verificando…</span>
  </header>

  <main>
    <section class="panel">
      <h2>Entrada</h2>

      <div class="row">
        <label>Pregunta</label>
        <input id="pregunta" type="text" placeholder="¿Qué técnico tiene mayor desviación de horas?" value="¿Qué patrones encuentras en estos datos? Identifica top 3 y anomalías." />
        <div class="presets">
          <span class="preset" data-q="¿Qué técnico tiene mayor desviación de horas estimadas vs reales?">Desviación técnicos</span>
          <span class="preset" data-q="Compara horas invertidas por cliente y ranking.">Ranking clientes</span>
          <span class="preset" data-q="Proyecta las horas totales del próximo mes con base en la tendencia.">Forecast mensual</span>
          <span class="preset" data-q="Detecta anomalías en las horas extra registradas.">Anomalías horas extra</span>
        </div>
      </div>

      <div class="row">
        <label>Datos JSON (array de objetos)</label>
        <textarea id="datos" spellcheck="false"></textarea>
      </div>

      <div class="actions">
        <button id="btn-analyze">
          <span class="material-symbols-outlined" style="font-size:18px;">bolt</span>
          Analizar
        </button>
        <button class="ghost" id="btn-sample">Cargar ejemplo</button>
        <button class="ghost" id="btn-clear">Limpiar</button>
      </div>
    </section>

    <section class="results">
      <div id="error-box"></div>
      <div id="results-area">
        <div class="empty">
          <span class="material-symbols-outlined">insights</span>
          <p>Carga datos y pulsa <b>Analizar</b> para ver KPIs, interpretación y gráficas.</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    const API = location.origin.includes("8000") ? "" : "http://localhost:8000";

    const SAMPLE = [
      { tecnico: "Juan",  cliente: "ROCEEL", actividad: "Mantenimiento",  horas_estimadas: 4, horas_reales: 6, fecha: "2026-04-01" },
      { tecnico: "Juan",  cliente: "ACME",   actividad: "Instalación",    horas_estimadas: 8, horas_reales: 7, fecha: "2026-04-03" },
      { tecnico: "María", cliente: "ROCEEL", actividad: "Diagnóstico",    horas_estimadas: 2, horas_reales: 3, fecha: "2026-04-05" },
      { tecnico: "María", cliente: "ACME",   actividad: "Soporte",        horas_estimadas: 3, horas_reales: 2, fecha: "2026-04-07" },
      { tecnico: "Luis",  cliente: "ROCEEL", actividad: "Mantenimiento",  horas_estimadas: 5, horas_reales: 9, fecha: "2026-04-09" },
      { tecnico: "Luis",  cliente: "BETA",   actividad: "Instalación",    horas_estimadas: 6, horas_reales: 6, fecha: "2026-04-12" },
      { tecnico: "Ana",   cliente: "BETA",   actividad: "Diagnóstico",    horas_estimadas: 2, horas_reales: 2, fecha: "2026-04-14" },
      { tecnico: "Ana",   cliente: "ACME",   actividad: "Mantenimiento",  horas_estimadas: 4, horas_reales: 12, fecha: "2026-04-18" }
    ];

    const $ = (s) => document.querySelector(s);
    const charts = [];

    document.querySelectorAll(".preset").forEach(p => {
      p.addEventListener("click", () => { $("#pregunta").value = p.dataset.q; });
    });

    $("#btn-sample").addEventListener("click", () => {
      $("#datos").value = JSON.stringify(SAMPLE, null, 2);
    });
    $("#btn-clear").addEventListener("click", () => {
      $("#datos").value = ""; $("#pregunta").value = "";
      $("#results-area").innerHTML = `<div class="empty"><span class="material-symbols-outlined">insights</span><p>Carga datos y pulsa <b>Analizar</b>.</p></div>`;
      $("#error-box").innerHTML = "";
    });
    $("#btn-analyze").addEventListener("click", analyze);

    $("#datos").value = JSON.stringify(SAMPLE, null, 2);

    // Health check
    (async () => {
      try {
        const r = await fetch(`${API}/api/health`);
        const d = await r.json();
        const pill = $("#health");
        if (d.gemini_configured) {
          pill.textContent = "● Conectado · Gemini OK";
          pill.classList.add("ok");
        } else {
          pill.textContent = "⚠ Gemini sin API key";
          pill.classList.add("err");
        }
      } catch {
        $("#health").textContent = "✕ Backend offline";
        $("#health").classList.add("err");
      }
    })();

    async function analyze() {
      const btn = $("#btn-analyze");
      const errBox = $("#error-box");
      errBox.innerHTML = "";

      const pregunta = $("#pregunta").value.trim();
      const raw = $("#datos").value.trim();
      if (!pregunta) { errBox.innerHTML = `<div class="err-box">Escribe una pregunta.</div>`; return; }
      if (!raw) { errBox.innerHTML = `<div class="err-box">Pega un JSON.</div>`; return; }

      let datos;
      try { datos = JSON.parse(raw); }
      catch (e) { errBox.innerHTML = `<div class="err-box">JSON inválido: ${e.message}</div>`; return; }

      btn.disabled = true;
      btn.innerHTML = `<div class="spinner"></div> Analizando…`;

      try {
        const r = await fetch(`${API}/api/analyze`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pregunta, datos })
        });
        if (!r.ok) {
          const t = await r.text();
          throw new Error(`${r.status}: ${t}`);
        }
        const data = await r.json();
        render(data);
      } catch (e) {
        errBox.innerHTML = `<div class="err-box">Error: ${e.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span class="material-symbols-outlined" style="font-size:18px;">bolt</span> Analizar`;
      }
    }

    function render(data) {
      charts.forEach(c => c.destroy());
      charts.length = 0;

      const area = $("#results-area");
      const kpis = (data.metricas || []).map(m => `
        <div class="kpi">
          <div class="label">${escapeHtml(m.label)}</div>
          <div class="value">${escapeHtml(m.valor)}</div>
        </div>
      `).join("");

      const charts_html = (data.graficas || []).map((g, i) => `
        <div class="chart-card">
          <h3>${escapeHtml(g.titulo)}</h3>
          <canvas id="chart-${i}"></canvas>
        </div>
      `).join("");

      area.innerHTML = `
        ${kpis ? `<div class="kpis">${kpis}</div>` : ""}
        ${data.interpretacion ? `<div class="interpret">${escapeHtml(data.interpretacion)}</div>` : ""}
        ${charts_html ? `<div class="chart-grid">${charts_html}</div>` : ""}
      `;

      (data.graficas || []).forEach((g, i) => {
        const ctx = document.getElementById(`chart-${i}`);
        if (!ctx) return;
        const type = mapType(g.tipo);
        const isPie = type === "pie" || type === "doughnut";
        const palette = ["#7c5cff", "#00d4ff", "#22c55e", "#f59e0b", "#ef4444", "#8b5cf6", "#ec4899", "#10b981"];

        const datasets = (g.datos.datasets || []).map((ds, di) => ({
          label: ds.label,
          data: ds.data,
          backgroundColor: isPie
            ? (ds.data || []).map((_, k) => palette[k % palette.length])
            : palette[di % palette.length] + "cc",
          borderColor: palette[di % palette.length],
          borderWidth: 2,
          tension: 0.3,
          fill: type === "line" ? false : undefined,
        }));

        const chart = new Chart(ctx, {
          type,
          data: { labels: g.datos.labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: "#e7ecf3" } },
            },
            scales: isPie ? {} : {
              x: { ticks: { color: "#8b94a8" }, grid: { color: "#232a3d" } },
              y: { ticks: { color: "#8b94a8" }, grid: { color: "#232a3d" } },
            },
            indexAxis: g.tipo === "horizontal_bar" ? "y" : "x",
          }
        });
        charts.push(chart);
      });
    }

    function mapType(t) {
      const m = { horizontal_bar: "bar", bar: "bar", line: "line", pie: "pie", doughnut: "doughnut", scatter: "scatter" };
      return m[t] || "bar";
    }
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
    }
  </script>
</body>
</html>
